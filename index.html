<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправка файлов для ИИ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Загрузка файла</h2>
    
    <form id="uploadForm">
        <div class="form-group">
            <input type="file" id="fileInput" name="file" required>
        </div>
        <button type="submit">Отправить ИИ</button>
    </form>

    <div id="status"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('status');
            
            if (fileInput.files.length === 0) {
                statusDiv.innerText = 'Пожалуйста, выберите файл.';
                statusDiv.style.color = 'red';
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            statusDiv.innerText = 'Отправка файла...';
            statusDiv.style.color = 'black';

            try {
                // Укажите URL нужного API вместо api.example.com
                const apiUrl = 'https://api.example.com/v1/upload'; 
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer AQ.Ab8RN6KhrydvSTj7yXqQdRlnyddpB4RJefv-wCnbswK_y_itiA'
                    },
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    statusDiv.innerText = 'Файл успешно обработан!';
                    statusDiv.style.color = 'green';
                    console.log('Ответ ИИ:', result);
                } else {
                    statusDiv.innerText = `Ошибка сервера: ${response.status}`;
                    statusDiv.style.color = 'red';
                }
            } catch (error) {
                statusDiv.innerText = 'Ошибка сети или CORS.';
                statusDiv.style.color = 'red';
                console.error('Детали ошибки:', error);
            }
        });
    </script>

</body>
</html>
